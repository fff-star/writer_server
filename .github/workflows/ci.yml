name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libreoffice xvfb
      - name: Allow bubblewrap user namespaces
        # Ubuntu 24.04 mediates unprivileged user namespaces with AppArmor, which
        # makes bwrap's loopback setup fail with EPERM (fatal on bwrap 0.9). Load a
        # profile that grants bwrap user namespaces on this runner.
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            echo "bwrap-userns-restrict profile already loaded"
          elif [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo tee /etc/apparmor.d/office-agent-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile office-agent-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/office-agent-bwrap
          fi
      - name: Verify sandbox launcher
        run: |
          bwrap --version
          sandbox_root="$(mktemp -d)"
          bwrap_args=(--die-with-parent --new-session --unshare-all --cap-drop ALL --clearenv)
          for path in /usr /lib /lib64 /bin /sbin; do
            if [ -e "$path" ]; then
              bwrap_args+=(--ro-bind "$path" "$path")
            fi
          done
          bwrap "${bwrap_args[@]}" \
            --dev /dev --proc /proc --tmpfs /tmp \
            --dir /workspace --bind "$sandbox_root" /workspace --chdir /workspace \
            --setenv PATH /usr/bin:/bin --setenv HOME /tmp \
            -- /bin/bash -c 'printf ok > /workspace/result.txt'
          test -f "$sandbox_root/result.txt"
          rm -rf "$sandbox_root"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check documentation impact
        env:
          DOCS_IMPACT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
          DOCS_IMPACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DOCS_IMPACT_NOTE: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message }}
        run: pnpm docs:impact
      - run: pnpm docs:check
      - run: pnpm build
      - run: pnpm test:integration
      - run: xvfb-run -a pnpm test:e2e
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-failure-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  windows-sandbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5
      - name: Build sandbox helper
        working-directory: native/windows-sandbox
        run: .\build.cmd
      - name: Test sandbox helper
        working-directory: native/windows-sandbox
        shell: pwsh
        run: .\test.ps1 -Executable .\bin\windows-sandbox.exe
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

  package:
    needs:
      - quality
      - windows-sandbox
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      - if: runner.os == 'Linux'
        run: node scripts/package-linux-portable.mjs
      - run: node scripts/hash-artifacts.mjs release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-${{ matrix.os }}
          path: release/
          if-no-files-found: error
