appId: dev.officeagent.desktop
productName: Office Agent
executableName: office-agent
artifactName: office-agent-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
files:
  - out/**
  - package.json
linux:
  target:
    - AppImage
    - deb
  category: Office
  syncDesktopName: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
